<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后端 API 手动测试页面 - Stock</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 20px; background: #f5f6f8; color: #333; line-height: 1.6; }
  h1 { text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .section h2 { margin: 0 0 16px 0; font-size: 18px; color: #1a1a2e; border-left: 4px solid #1a1a2e; padding-left: 10px; }
  .flex-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .col-6 { flex: 1 1 48%; min-width: 300px; }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #555; }
  input, select, textarea, button { font-family: inherit; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #1a1a2e; }
  textarea { resize: vertical; min-height: 60px; }
  .btn { background: #1a1a2e; color: #fff; border: none; cursor: pointer; padding: 10px 16px; border-radius: 6px; font-weight: 600; width: auto; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn-danger { background: #e74c3c; }
  .btn-success { background: #27ae60; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .result-box { background: #f8f9fa; border: 1px solid #e1e4e8; border-radius: 6px; padding: 12px; margin-top: 12px; font-family: "SF Mono", Consolas, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; color: #333; }
  .result-box.error { background: #fff5f5; border-color: #feb2b2; color: #c53030; }
  .result-box.success { background: #f0fff4; border-color: #9ae6b4; color: #22543d; }
  .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .summary-table th, .summary-table td { padding: 8px 10px; border: 1px solid #e1e4e8; text-align: left; }
  .summary-table th { background: #f5f6f8; font-weight: 600; }
  .summary-table tr:nth-child(even) { background: #fafbfc; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .badge-positive { background: #c6f6d5; color: #22543d; }
  .badge-negative { background: #fed7d7; color: #c53030; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  hr { border: none; border-top: 1px solid #e1e4e8; margin: 20px 0; }
  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick-actions button { width: auto; padding: 6px 12px; font-size: 12px; }
</style>
</head>
<body>

<div class="container">
  <h1>后端 API 手动测试页面</h1>
  <p class="subtitle">Stock & Transaction CRUD 测试 | 后端地址: <code>http://localhost:8080</code></p>

  <!-- 快捷操作 -->
  <div class="section">
    <h2>快捷操作</h2>
    <div class="quick-actions">
      <button class="btn" onclick="quickTest()">一键完整测试流程</button>
      <button class="btn btn-danger" onclick="clearAll()">删除所有测试数据</button>
      <button class="btn" onclick="fetchAllStocks()">刷新所有个股</button>
      <button class="btn" onclick="fetchAllTransactions()">刷新所有交易记录</button>
    </div>
    <div id="quickResult" class="result-box" style="display:none"></div>
  </div>

  <!-- 个股操作 -->
  <div class="section">
    <h2>个股 (Stock) CRUD</h2>
    <div class="flex-row">
      <div class="col-6">
        <h3>创建个股</h3>
        <div class="form-group">
          <label>交易所 (exchange)</label>
          <select id="stockExchange">
            <option value="SH">SH - 上海</option>
            <option value="SZ">SZ - 深圳</option>
            <option value="HK">HK - 香港</option>
            <option value="US">US - 美国</option>
          </select>
        </div>
        <div class="form-group">
          <label>个股标识 (symbol)</label>
          <input type="text" id="stockSymbol" placeholder="如 600519 或 AAPL" value="600519">
        </div>
        <div class="form-group">
          <label>个股名称 (name)</label>
          <input type="text" id="stockName" placeholder="如 贵州茅台" value="贵州茅台">
        </div>
        <div class="form-group">
          <label>交易货币 (currency)</label>
          <input type="text" id="stockCurrency" placeholder="如 CNY, USD, HKD" value="CNY">
        </div>
        <div class="btn-group">
          <button class="btn" onclick="createStock()">创建个股</button>
        </div>
      </div>
      <div class="col-6">
        <h3>查询 / 更新 / 删除</h3>
        <div class="form-group">
          <label>个股 ID</label>
          <input type="text" id="stockId" placeholder="粘贴个股 ID">
        </div>
        <div class="btn-group">
          <button class="btn" onclick="getStock()">查询详情</button>
          <button class="btn btn-success" onclick="updateStock()">更新</button>
          <button class="btn btn-danger" onclick="deleteStock()">删除</button>
        </div>
        <div id="stockResult" class="result-box" style="display:none"></div>
      </div>
    </div>
    <hr>
    <h3>所有个股列表</h3>
    <div id="stocksTable"></div>
  </div>

  <!-- 交易记录操作 -->
  <div class="section">
    <h2>交易记录 (Transaction) CRUD</h2>
    <div class="flex-row">
      <div class="col-6">
        <h3>创建交易记录</h3>
        <div class="form-group">
          <label>关联个股 ID (stock_id)</label>
          <input type="text" id="txnStockId" placeholder="粘贴个股 ID">
          <p class="hint">正数 = 买入，负数 = 卖出</p>
        </div>
        <div class="form-group">
          <label>交易数量 (quantity)</label>
          <input type="number" id="txnQuantity" placeholder="100 或 -50" value="100">
        </div>
        <div class="form-group">
          <label>交易价格 (price)</label>
          <input type="number" step="0.01" id="txnPrice" placeholder="10.0" value="10.0">
        </div>
        <div class="form-group">
          <label>手续费 (gas)</label>
          <input type="number" step="0.01" id="txnGas" placeholder="0.0" value="5.0">
        </div>
        <div class="form-group">
          <label>交易日期 (traded_at)</label>
          <input type="date" id="txnTradedAt" value="2025-06-01">
        </div>
        <div class="btn-group">
          <button class="btn" onclick="createTransaction()">创建交易记录</button>
        </div>
      </div>
      <div class="col-6">
        <h3>查询 / 更新 / 删除</h3>
        <div class="form-group">
          <label>交易记录 ID</label>
          <input type="text" id="txnId" placeholder="粘贴交易记录 ID">
        </div>
        <div class="btn-group">
          <button class="btn" onclick="getTransaction()">查询详情</button>
          <button class="btn btn-success" onclick="updateTransaction()">更新</button>
          <button class="btn btn-danger" onclick="deleteTransaction()">删除</button>
        </div>
        <div class="form-group" style="margin-top:12px">
          <label>按个股查询交易记录</label>
          <input type="text" id="txnStockIdQuery" placeholder="粘贴个股 ID">
          <button class="btn" onclick="getStockTransactions()" style="margin-top:8px">查询该个股的所有交易记录</button>
        </div>
        <div id="txnResult" class="result-box" style="display:none"></div>
      </div>
    </div>
    <hr>
    <h3>所有交易记录列表</h3>
    <div id="transactionsTable"></div>
  </div>

</div>

<script>
const BASE = 'http://localhost:8080';

function showResult(elId, text, isError) {
  const el = document.getElementById(elId);
  el.style.display = 'block';
  el.textContent = typeof text === 'object' ? JSON.stringify(text, null, 2) : text;
  el.className = 'result-box ' + (isError ? 'error' : 'success');
}

async function request(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(BASE + path, opts);
  const text = await res.text();
  try { return { status: res.status, body: JSON.parse(text) }; }
  catch { return { status: res.status, body: text }; }
}

// ─── Stock ───

async function createStock() {
  const data = {
    exchange: document.getElementById('stockExchange').value,
    symbol: document.getElementById('stockSymbol').value,
    name: document.getElementById('stockName').value,
    currency: document.getElementById('stockCurrency').value,
  };
  const r = await request('POST', '/api/stocks', data);
  showResult('stockResult', r, r.status >= 300);
  if (r.status < 300) { document.getElementById('stockId').value = r.body.id; }
  fetchAllStocks();
}

async function getStock() {
  const id = document.getElementById('stockId').value.trim();
  if (!id) return alert('请输入个股 ID');
  const r = await request('GET', '/api/stocks/' + id);
  showResult('stockResult', r, r.status >= 300);
}

async function updateStock() {
  const id = document.getElementById('stockId').value.trim();
  if (!id) return alert('请输入个股 ID');
  const data = {
    exchange: document.getElementById('stockExchange').value,
    symbol: document.getElementById('stockSymbol').value,
    name: document.getElementById('stockName').value,
    currency: document.getElementById('stockCurrency').value,
  };
  const r = await request('PUT', '/api/stocks/' + id, data);
  showResult('stockResult', r, r.status >= 300);
  fetchAllStocks();
}

async function deleteStock() {
  const id = document.getElementById('stockId').value.trim();
  if (!id) return alert('请输入个股 ID');
  if (!confirm('确定删除该个股？将级联删除其交易记录。')) return;
  const r = await request('DELETE', '/api/stocks/' + id);
  showResult('stockResult', r.status === 204 ? '删除成功' : r, r.status >= 300);
  fetchAllStocks();
  fetchAllTransactions();
}

async function fetchAllStocks() {
  const r = await request('GET', '/api/stocks');
  const el = document.getElementById('stocksTable');
  if (r.status >= 300) { el.innerHTML = '<p style="color:red">加载失败</p>'; return; }
  const rows = r.body;
  if (!rows.length) { el.innerHTML = '<p style="color:#888">暂无数据</p>'; return; }
  let html = '<table class="summary-table"><thead><tr>' +
    '<th>ID</th><th>交易所</th><th>标识</th><th>名称</th><th>货币</th>' +
    '<th>持仓</th><th>历史盈亏</th><th>操作</th></tr></thead><tbody>';
  rows.forEach(s => {
    const pnlClass = s.historical_pnl >= 0 ? 'badge-positive' : 'badge-negative';
    const pnlText = s.historical_pnl >= 0 ? '+' + s.historical_pnl : s.historical_pnl;
    html += `<tr>
      <td>${s.id.substring(0,8)}...</td>
      <td>${s.exchange}</td>
      <td>${s.symbol}</td>
      <td>${s.name}</td>
      <td>${s.currency}</td>
      <td>${s.position}</td>
      <td><span class="badge ${pnlClass}">${pnlText}</span></td>
      <td><button class="btn" style="padding:4px 8px;font-size:12px;" onclick="document.getElementById('stockId').value='${s.id}';document.getElementById('txnStockId').value='${s.id}';document.getElementById('txnStockIdQuery').value='${s.id}';getStock();">查看</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

// ─── Transaction ───

async function createTransaction() {
  const data = {
    stock_id: document.getElementById('txnStockId').value.trim(),
    quantity: parseFloat(document.getElementById('txnQuantity').value),
    price: parseFloat(document.getElementById('txnPrice').value),
    gas: parseFloat(document.getElementById('txnGas').value || 0),
    traded_at: document.getElementById('txnTradedAt').value,
  };
  const r = await request('POST', '/api/transactions', data);
  showResult('txnResult', r, r.status >= 300);
  if (r.status < 300) { document.getElementById('txnId').value = r.body.id; }
  fetchAllStocks();
  fetchAllTransactions();
}

async function getTransaction() {
  const id = document.getElementById('txnId').value.trim();
  if (!id) return alert('请输入交易记录 ID');
  const r = await request('GET', '/api/transactions/' + id);
  showResult('txnResult', r, r.status >= 300);
}

async function updateTransaction() {
  const id = document.getElementById('txnId').value.trim();
  if (!id) return alert('请输入交易记录 ID');
  const data = {};
  const qty = document.getElementById('txnQuantity').value;
  const price = document.getElementById('txnPrice').value;
  const gas = document.getElementById('txnGas').value;
  const traded_at = document.getElementById('txnTradedAt').value;
  if (qty !== '') data.quantity = parseFloat(qty);
  if (price !== '') data.price = parseFloat(price);
  if (gas !== '') data.gas = parseFloat(gas);
  if (traded_at) data.traded_at = traded_at;
  const r = await request('PUT', '/api/transactions/' + id, data);
  showResult('txnResult', r, r.status >= 300);
  fetchAllStocks();
  fetchAllTransactions();
}

async function deleteTransaction() {
  const id = document.getElementById('txnId').value.trim();
  if (!id) return alert('请输入交易记录 ID');
  if (!confirm('确定删除该交易记录？')) return;
  const r = await request('DELETE', '/api/transactions/' + id);
  showResult('txnResult', r.status === 204 ? '删除成功' : r, r.status >= 300);
  fetchAllStocks();
  fetchAllTransactions();
}

async function getStockTransactions() {
  const stockId = document.getElementById('txnStockIdQuery').value.trim();
  if (!stockId) return alert('请输入个股 ID');
  const r = await request('GET', '/api/transactions/stock/' + stockId);
  showResult('txnResult', r, r.status >= 300);
}

async function fetchAllTransactions() {
  const r = await request('GET', '/api/transactions');
  const el = document.getElementById('transactionsTable');
  if (r.status >= 300) { el.innerHTML = '<p style="color:red">加载失败</p>'; return; }
  const rows = r.body;
  if (!rows.length) { el.innerHTML = '<p style="color:#888">暂无数据</p>'; return; }
  let html = '<table class="summary-table"><thead><tr>' +
    '<th>ID</th><th>stock_id</th><th>数量</th><th>价格</th><th>手续费</th><th>日期</th><th>操作</th></tr></thead><tbody>';
  rows.forEach(t => {
    const qtyClass = t.quantity >= 0 ? 'badge-positive' : 'badge-negative';
    html += `<tr>
      <td>${t.id.substring(0,8)}...</td>
      <td>${t.stock_id.substring(0,8)}...</td>
      <td><span class="badge ${qtyClass}">${t.quantity}</span></td>
      <td>${t.price}</td>
      <td>${t.gas}</td>
      <td>${t.traded_at}</td>
      <td><button class="btn" style="padding:4px 8px;font-size:12px;" onclick="document.getElementById('txnId').value='${t.id}';getTransaction();">查看</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

// ─── Quick Test ───

async function quickTest() {
  const out = document.getElementById('quickResult');
  out.style.display = 'block';
  out.className = 'result-box';
  out.textContent = '测试中...';

  const logs = [];
  const log = (msg) => { logs.push(msg); out.textContent = logs.join('\n'); };

  try {
    // 1. 创建个股
    log('1. 创建个股...');
    const stock = await request('POST', '/api/stocks', {
      exchange: 'SH', symbol: '600519', name: '贵州茅台', currency: 'CNY'
    });
    if (stock.status >= 300) throw new Error('创建个股失败: ' + JSON.stringify(stock));
    const stockId = stock.body.id;
    log('   成功, ID=' + stockId);

    // 2. 买入 100 股 @ 10, gas=5
    log('2. 买入 100 股 @ 10, gas=5...');
    const buy = await request('POST', '/api/transactions', {
      stock_id: stockId, quantity: 100, price: 10, gas: 5, traded_at: '2025-06-01'
    });
    if (buy.status >= 300) throw new Error('买入失败');
    log('   成功');

    // 3. 检查持仓
    log('3. 检查个股持仓...');
    const s1 = await request('GET', '/api/stocks/' + stockId);
    log('   position=' + s1.body.position + ', historical_pnl=' + s1.body.historical_pnl);
    if (s1.body.position !== 100) throw new Error('position 应为 100');
    if (s1.body.historical_pnl !== -1005) throw new Error('historical_pnl 应为 -1005');

    // 4. 卖出 50 股 @ 12, gas=3
    log('4. 卖出 50 股 @ 12, gas=3...');
    const sell = await request('POST', '/api/transactions', {
      stock_id: stockId, quantity: -50, price: 12, gas: 3, traded_at: '2025-06-15'
    });
    if (sell.status >= 300) throw new Error('卖出失败');
    log('   成功');

    // 5. 检查持仓
    log('5. 检查个股持仓...');
    const s2 = await request('GET', '/api/stocks/' + stockId);
    log('   position=' + s2.body.position + ', historical_pnl=' + s2.body.historical_pnl);
    if (s2.body.position !== 50) throw new Error('position 应为 50');
    if (s2.body.historical_pnl !== -408) throw new Error('historical_pnl 应为 -408');

    // 6. 更新卖出数量 -50 → -40
    log('6. 更新卖出数量 -50 → -40...');
    const upd = await request('PUT', '/api/transactions/' + sell.body.id, {
      quantity: -40, price: 12, gas: 3, traded_at: '2025-06-15'
    });
    if (upd.status >= 300) throw new Error('更新失败');
    log('   成功');

    // 7. 检查持仓
    log('7. 检查个股持仓...');
    const s3 = await request('GET', '/api/stocks/' + stockId);
    log('   position=' + s3.body.position + ', historical_pnl=' + s3.body.historical_pnl);
    if (s3.body.position !== 60) throw new Error('position 应为 60');
    if (s3.body.historical_pnl !== -528) throw new Error('historical_pnl 应为 -528');

    // 8. 删除买入记录
    log('8. 删除买入记录...');
    const delRes = await request('DELETE', '/api/transactions/' + buy.body.id);
    if (delRes.status >= 300) throw new Error('删除失败');
    log('   成功');

    // 9. 最终检查
    log('9. 最终检查...');
    const s4 = await request('GET', '/api/stocks/' + stockId);
    log('   position=' + s4.body.position + ', historical_pnl=' + s4.body.historical_pnl);
    if (s4.body.position !== -40) throw new Error('position 应为 -40');
    if (s4.body.historical_pnl !== 477) throw new Error('historical_pnl 应为 477');

    // 10. 清理
    log('10. 删除个股...');
    await request('DELETE', '/api/stocks/' + stockId);
    log('   全部测试通过! ✓');
    out.className = 'result-box success';

  } catch (e) {
    log('测试失败: ' + e.message);
    out.className = 'result-box error';
  }

  fetchAllStocks();
  fetchAllTransactions();
}

async function clearAll() {
  if (!confirm('确定删除所有数据？')) return;
  const stocks = await request('GET', '/api/stocks');
  if (stocks.status < 300 && stocks.body) {
    for (const s of stocks.body) {
      await request('DELETE', '/api/stocks/' + s.id);
    }
  }
  document.getElementById('quickResult').style.display = 'none';
  fetchAllStocks();
  fetchAllTransactions();
}

// 页面加载时自动刷新
fetchAllStocks();
fetchAllTransactions();
</script>

</body>
</html>
