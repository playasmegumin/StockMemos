version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: trading-db
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: agent_trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d agent_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: trading-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: >
      bash -c "
        until pg_isready -h db -p 5432 -U trading; do
          echo 'Waiting for DB...'
          sleep 2
        done
        alembic upgrade head
        uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
      "

volumes:
  postgres_data:
