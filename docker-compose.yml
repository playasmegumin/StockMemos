version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: trading-db
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: agent_trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d agent_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: trading-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./test:/app/test
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      bash -c "
        uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
      "

  frontend:
    build: ./frontend
    container_name: trading-frontend
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
    environment:
      - API_BASE=http://backend:8080/api

volumes:
  postgres_data:
